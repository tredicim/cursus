name: Bug report
description: Something is broken or behaves unexpectedly.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Search the existing issues first, and
        [report security problems privately](https://github.com/tredicim/cursus/blob/main/SECURITY.md)
        instead of opening a public issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands or clicks that trigger the problem.
      placeholder: |
        1. Run `cargo run -p cursus-cli -- ...`
        2. ...
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: Paste the relevant output. Use `--json` when possible, and remove personal data.
      render: shell
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - OS:
        - Cursus version or commit:
        - Rust version (`rustc --version`):
        - LaTeX engine, if the bug involves PDF output:
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help, such as a minimal data file.
    validations:
      required: false
