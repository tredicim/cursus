[workspace]
resolver = "3"
members = ["crates/core", "crates/render", "crates/cli"]
default-members = ["crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tredicim/cursus"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
yaml_serde = "0.10"
